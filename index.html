<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071014">
  <title>RAML vs GADGET</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand-button" id="home-button" aria-label="タイトルへ">
        <span class="brand-mark">R<span>／</span>G</span>
        <span class="brand-copy">RAML vs GADGET</span>
      </button>
      <div class="topbar-actions">
        <button class="icon-button" id="analysis-button" aria-label="解析記録">解析</button>
        <button class="icon-button" id="records-button" aria-label="記録室">記録</button>
        <button class="icon-button" id="settings-button" aria-label="設定">設定</button>
      </div>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>
    <div id="toast-layer" class="toast-layer" aria-live="assertive"></div>

    <dialog id="settings-modal" class="modal">
      <form method="dialog" class="modal-card">
        <div class="modal-heading">
          <p class="eyebrow">SYSTEM</p>
          <h2>設定</h2>
          <button class="modal-close" value="close" aria-label="閉じる">×</button>
        </div>
        <label class="setting-row">
          <span>文字送り</span>
          <select id="text-speed">
            <option value="fast">速い</option>
            <option value="normal">標準</option>
            <option value="slow">ゆっくり</option>
          </select>
        </label>
        <label class="setting-row">
          <span>文字サイズ</span>
          <select id="text-size">
            <option value="standard">標準</option>
            <option value="large">大きい</option>
          </select>
        </label>
        <label class="setting-row toggle-row">
          <span>動きを控えめにする</span>
          <input id="reduced-motion" type="checkbox">
        </label>
        <button type="button" class="danger-button" id="reset-save">セーブを初期化</button>
      </form>
    </dialog>

    <dialog id="info-modal" class="modal">
      <section class="modal-card info-card">
        <div class="modal-heading">
          <p class="eyebrow" id="info-kicker">ARCHIVE</p>
          <h2 id="info-title">記録</h2>
          <button class="modal-close" id="info-close" aria-label="閉じる">×</button>
        </div>
        <div id="info-content" class="info-content"></div>
      </section>
    </dialog>
  </div>

  <script src="asset-registry.js"></script>
  <script src="series-data.js"></script>
  <script src="scenario-data.js"></script>
  <script src="battle-data.js"></script>
  <script src="chapter-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
